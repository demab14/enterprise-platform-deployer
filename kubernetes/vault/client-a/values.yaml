server:
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        seal "awskms" {
          region     = "eu-west-2"
          kms_key_id = "a597d419-7f66-4886-bac5-6ed47dcde67b"
        }
        service_registration "kubernetes" {}

  serviceAccount:
    create: true
    name: vault
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::743676310994:role/epd-client-a-vault-kms-role"

  extraEnvironmentVars:
    AWS_REGION: eu-west-2

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  dataStorage:
    enabled: true
    size: 5Gi

  auditStorage:
    enabled: true
    size: 2Gi

ui:
  enabled: true
  serviceType: ClusterIP
